<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jeong Gwan Woo Portfolio Integrated Draft</title>
  <style>
    :root {
      --page-w: 1600px;
      --page-h: 900px;
      --paper-bg: #eef2f7;
      --page-shadow: 0 18px 48px rgba(15, 23, 42, .16);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--paper-bg);
      font-family: "Malgun Gothic", "맑은 고딕", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .integrated-deck {
      width: calc(var(--page-w) + 48px);
      max-width: 100%;
      margin: 0 auto;
      padding: 24px 24px 48px;
      display: grid;
      gap: 24px;
    }

    .page {
      width: var(--page-w);
      max-width: 100%;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      box-shadow: var(--page-shadow);
    }

    .page img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
    }

    @media print {
      @page { size: 16in 9in; margin: 0; }
      html, body { width: 16in; background: #fff; }
      .integrated-deck { width: 16in; padding: 0; gap: 0; }
      .page {
        width: 16in;
        height: 9in;
        max-width: none;
        margin: 0;
        box-shadow: none;
        break-after: page;
        page-break-after: always;
      }
      .page:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
